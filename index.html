<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Music Player</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <!-- Sidebar: Playlist and Controls -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Mi Biblioteca</h2>
                <button id="load-mp3" class="btn-primary">
                    <span class="icon">➕</span> Cargar Música
                </button>
            </div>
            
            <div class="playlist-container">
                <ul id="playlist-ui">
                    <!-- Playlist items will be injected here -->
                </ul>
            </div>

            <div class="sidebar-footer">
                <p id="status">Listo para reproducir</p>
            </div>
        </aside>

        <!-- Main Content: Now Playing View -->
        <main class="main-view">
            <div class="player-card">
                <div class="track-info">
                    <div class="cover-art" id="cover-art">
                        <div class="placeholder-icon">🎵</div>
                    </div>
                    <div class="text-meta">
                        <h1 id="track-title-display">Selecciona una canción</h1>
                        <p id="now-playing">Ahora suena: Nada</p>
                    </div>
                </div>

                <!-- Custom Audio System -->
                <audio id="audio-player"></audio>
                
                <div class="playback-controls">
                    <!-- Progress Section -->
                    <div class="progress-section">
                        <span id="current-time">0:00</span>
                        <div class="slider-container">
                            <input type="range" id="seek-slider" max="100" value="0" class="styled-slider">
                            <div class="progress-bar-fill" id="progress-bar-fill"></div>
                        </div>
                        <span id="total-duration">0:00</span>
                    </div>

                    <!-- Button Section -->
                    <div class="button-group">
                        <button id="prev-btn" class="ctrl-btn" title="Anterior">⏮</button>
                        <button id="play-pause-btn" class="play-btn" title="Reproducir">▶</button>
                        <button id="next-btn" class="ctrl-btn" title="Siguiente">⏭</button>
                        <button id="repeat-btn" class="ctrl-btn" title="Repetir">🔁</button>
                    </div>

                    <!-- Volume Section -->
                    <div class="volume-section">
                        <span class="icon-vol">🔊</span>
                        <input type="range" id="volume-slider" max="100" value="100" class="volume-slider">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="./renderer.js"></script>
</body>
</html>
